<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="Zeus cycle: forecast, probability, edge, size, execute, settle, then a filtered feedback loop into calibration"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7681"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3B341"/></marker></defs><rect width="1240" height="560" fill="#0D1117"/><text x="44" y="48" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Zeus — one cycle</text><text x="44" y="71" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198A1">Daily high / low temperature markets across 54 cities. The cycle repeats continuously; every stage re-decides on new data.</text><rect x="44" y="96" width="1152" height="46" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.25"/><text x="60" y="115" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.1" fill="#9198A1">SOURCES</text><text x="60" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.8" fill="#E6EDF3">5 NWP ensemble families (ECMWF · ICON/DWD · NOAA · UKMO · GEM)   │   official stations (Hong Kong Observatory · Taiwan CWA · METAR)   │   Polymarket WebSocket (book · fills · settlement)</text><rect x="44" y="176" width="185" height="150" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.25"/><text x="57" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">1  FORECAST</text><line x1="57" y1="210" x2="216" y2="210" stroke="#21262D" stroke-width="1"/><text x="57" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">de-bias  (emp. Bayes,</text><text x="57" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  settled residuals only)</text><text x="57" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">fuse  (inverse-variance,</text><text x="57" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  Ledoit–Wolf shrunk)</text><text x="57" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">localize to station</text><rect x="241" y="176" width="185" height="150" rx="8" fill="#0C2647" stroke="#58A6FF" stroke-width="1.25"/><text x="254" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">2  PROBABILITY</text><line x1="254" y1="210" x2="413" y2="210" stroke="#21262D" stroke-width="1"/><text x="254" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">integrate over the</text><text x="254" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">PREIMAGE of the</text><text x="254" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">rounding rule — not</text><text x="254" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">the bin's face value</text><text x="254" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">condition on observed</text><line x1="230" y1="251.0" x2="239" y2="251.0" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><rect x="438" y="176" width="185" height="150" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.25"/><text x="451" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">3  EDGE</text><line x1="451" y1="210" x2="610" y2="210" stroke="#21262D" stroke-width="1"/><text x="451" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">bootstrap lower bound</text><text x="451" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">Wilson selection</text><text x="451" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  calibrator (30+ settled)</text><text x="451" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">minus all-in cost</text><text x="451" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">Benjamini–Hochberg FDR</text><line x1="427" y1="251.0" x2="436" y2="251.0" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><rect x="635" y="176" width="185" height="150" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.25"/><text x="648" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">4  SIZE</text><line x1="648" y1="210" x2="807" y2="210" stroke="#21262D" stroke-width="1"/><text x="648" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">fractional Kelly</text><text x="648" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">multiplicative damping</text><text x="648" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  coverage · width · lead</text><text x="648" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  · heat · data density</text><text x="648" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">missing input → zero</text><line x1="624" y1="251.0" x2="633" y2="251.0" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><rect x="832" y="176" width="185" height="150" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.25"/><text x="845" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">5  EXECUTE</text><line x1="845" y1="210" x2="1004" y2="210" stroke="#21262D" stroke-width="1"/><text x="845" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">post-only maker rest</text><text x="845" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">→ FOK taker on deadline</text><text x="845" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">intent written before</text><text x="845" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">  the venue is called</text><text x="845" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">hourly chain reconcile</text><line x1="821" y1="251.0" x2="830" y2="251.0" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><rect x="1029" y="176" width="185" height="150" rx="8" fill="#0C2647" stroke="#58A6FF" stroke-width="1.25"/><text x="1042" y="201" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3" fill="#E6EDF3">6  SETTLE</text><line x1="1042" y1="210" x2="1201" y2="210" stroke="#21262D" stroke-width="1"/><text x="1042" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">six-class attribution:</text><text x="1042" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">earned win · lucky win</text><text x="1042" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">foreseeable loss</text><text x="1042" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">miscalibration loss</text><text x="1042" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#9198A1">stale-data · unattrib.</text><line x1="1018" y1="251.0" x2="1027" y2="251.0" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><line x1="44" y1="144" x2="44" y2="174" stroke="#6E7681" stroke-width="0"/><line x1="136.5" y1="144" x2="136.5" y2="173" stroke="#6E7681" stroke-width="1.5" marker-end="url(#a)"/><line x1="1121.5" y1="144" x2="1121.5" y2="173" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><path d="M 1121.5 326 L 1121.5 404 L 754.0 404" fill="none" stroke="#E3B341" stroke-width="1.7" marker-end="url(#g)"/><path d="M 486.0 404 L 136.5 404 L 136.5 329" fill="none" stroke="#E3B341" stroke-width="1.7" marker-end="url(#g)"/><rect x="486.0" y="373.0" width="268" height="62" rx="10" fill="#2E2408" stroke="#E3B341" stroke-width="1.4"/><text x="620.0" y="398" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#E3B341">CALIBRATION</text><text x="620.0" y="415" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#E3B341">gate: skill outcomes only</text><text x="620.0" y="429" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" fill="#E3B341">a lucky win teaches nothing</text><text x="1107.5" y="382" text-anchor="end" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198A1">settled outcomes, graded</text><text x="150.5" y="382" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198A1">re-fit per-source bias, spread, selection cells</text><line x1="44" y1="496" x2="1196" y2="496" stroke="#21262D" stroke-width="1"/><text x="44" y="520" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198A1">A resting order whose edge has faded is pulled and decided again. A fresh forecast cycle on a market already held is itself new information.</text><text x="44" y="538" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198A1">The probability a position was sized on is frozen at decision time, so attribution compares the decision that was actually made — not one reconstructed after the fact.</text></svg>