<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="Zeus architecture: forecast to probability to edge to size to execution to settlement, with settled outcomes graded against frozen decisions and fed back into calibration"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A929E"/></marker></defs><rect width="1240" height="600" fill="#FFFFFF"/><text x="40" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111418">Zeus — one cycle</text><text x="40" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6470">Daily high/low temperature markets, 54 cities. The cycle repeats; every stage re-decides on new data.</text><text x="40" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.1" fill="#5B6470">SOURCES</text><rect x="40" y="100" width="196" height="56" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="54" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="0.4" fill="#111418">NWP ensembles</text><text x="54" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">ECMWF · ICON · NOAA</text><text x="54" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">UKMO · GEM</text><rect x="40" y="168" width="196" height="56" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="54" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="0.4" fill="#111418">Official stations</text><text x="54" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">Hong Kong Observatory</text><text x="54" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">Taiwan CWA · METAR</text><rect x="40" y="236" width="196" height="56" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="54" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="0.4" fill="#111418">Venue</text><text x="54" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">Polymarket WebSocket</text><text x="54" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">book · fills · settlement</text><text x="276" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.1" fill="#5B6470">DECIDE</text><rect x="276" y="100" width="216" height="124" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="290" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">1  FORECAST</text><text x="290" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">raw current centers</text><text x="290" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">history sets trust + covariance</text><text x="290" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">current-cycle evidence width</text><text x="290" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">station/grid localization</text><rect x="514" y="100" width="216" height="124" rx="8" fill="#DBEAFE" stroke="#1F6FEB" stroke-width="1.25"/><text x="528" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">2  PROBABILITY</text><text x="528" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">integrate the PREIMAGE</text><text x="528" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">of each rounding rule</text><text x="528" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">condition on observed</text><text x="528" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">freeze one coherent q</text><line x1="494" y1="162.0" x2="511" y2="162.0" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><rect x="752" y="100" width="216" height="124" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="766" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">3  EDGE</text><text x="766" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">posterior-mean action q</text><text x="766" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">bounds gate admission+size</text><text x="766" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">all-in executable cost</text><text x="766" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">Benjamini–Hochberg FDR</text><line x1="732" y1="162.0" x2="749" y2="162.0" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><rect x="990" y="100" width="216" height="124" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="1004" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">4  SIZE</text><text x="1004" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">outcome-contingent wealth</text><text x="1004" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">robust log-wealth argmax</text><text x="1004" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">existing exposure included</text><text x="1004" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">missing authority → zero</text><line x1="970" y1="162.0" x2="987" y2="162.0" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><line x1="239" y1="162.0" x2="273" y2="162.0" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><text x="276" y="282" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.1" fill="#5B6470">ACT</text><rect x="276" y="290" width="336" height="100" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="290" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">5  EXECUTE</text><text x="290" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">post-only maker rest → taker cross on deadline</text><text x="290" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">idempotency-keyed intent written BEFORE the venue is called</text><text x="290" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">fresh submit-time redecision · per-cycle chain reconciliation</text><rect x="642" y="290" width="336" height="100" rx="8" fill="#DBEAFE" stroke="#1F6FEB" stroke-width="1.25"/><text x="656" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">6  SETTLE &amp; ATTRIBUTE</text><text x="656" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">forecast-earned win · lucky win · foreseeable loss</text><text x="656" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">miscalibration loss · stale-data decision · unattributable</text><text x="656" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">frozen-q decisions graded; missing certificates stay counted</text><line x1="615" y1="340" x2="639" y2="340" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><line x1="860.0" y1="224" x2="860.0" y2="276" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)"/><rect x="986" y="100" width="214" height="124" rx="8" fill="#F6F7F9" stroke="#D2D6DC" stroke-width="1.25"/><text x="1000" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0.4" fill="#111418">CALIBRATION</text><text x="1000" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">walk-forward settled</text><text x="1000" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">residuals · selection cells</text><text x="1000" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470"></text><text x="1000" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">reliability measured on</text><text x="1000" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">ALL eligible frozen</text><text x="1000" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">decisions</text><path d="M 810.0 390 L 810.0 422 L 1093 422 L 1093 232" fill="none" stroke="#B45309" stroke-width="1.6" marker-end="url(#ah)"/><rect x="943" y="405" width="300" height="34" rx="17" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/><text x="1093" y="426.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#B45309">attribution classifies — it never filters</text><text x="826.0" y="410" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6470">outcomes update the next decision, never the record of the last one</text><line x1="983" y1="162.0" x2="1209" y2="162.0" stroke="#8A929E" stroke-width="1.4" marker-end="url(#ah)" transform="translate(0,0)"/><text x="40" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5B6470">Every stage is re-evaluated each cycle: a resting order whose edge faded is pulled and decided again; a fresh forecast on a held market is itself new information.</text></svg>